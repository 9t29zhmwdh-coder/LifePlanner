name: Release

# Builds the Tauri app on every tag push for macOS, Windows and Linux
# and attaches the bundles to a GitHub Release. Previously
# macOS+Windows only ("weder README noch CI erwaehnen Linux-Support"),
# but db_path() already has a real #[cfg(target_os = "linux")] branch
# (via the cross-platform `dirs` crate) and there are no OS-exclusive
# external process calls anywhere in the app, so extended to Linux too.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LifePlanner ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details. Not code-signed/notarized: macOS Gatekeeper and Windows SmartScreen will show warnings on first run.'
          releaseDraft: false
          prerelease: false

      - name: Upload stable-named DMG (for README download link)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find target/release/bundle/dmg -name "*.dmg" | head -1)
          cp "$dmg" LifePlanner.dmg
          gh release upload "${{ github.ref_name }}" LifePlanner.dmg --clobber --repo ${{ github.repository }}

      - name: Upload stable-named installer (for README download link)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "LifePlanner-Setup.exe"
          gh release upload "${{ github.ref_name }}" "LifePlanner-Setup.exe" --clobber --repo ${{ github.repository }}

      - name: Upload stable-named AppImage (for README download link)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage=$(find target/release/bundle/appimage -name "*.AppImage" | head -1)
          cp "$appimage" LifePlanner.AppImage
          gh release upload "${{ github.ref_name }}" LifePlanner.AppImage --clobber --repo ${{ github.repository }}
